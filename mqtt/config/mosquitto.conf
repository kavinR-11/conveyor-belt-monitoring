# =============================================================================
# Eclipse Mosquitto configuration — local development
# =============================================================================
#
# This configuration is intentionally permissive for local development.
# Before deploying to production or a Raspberry Pi in a shared network,
# enable TLS (listener 8883) and configure passwords via passwd_file.
# =============================================================================

# Allow connections without authentication (dev only)
allow_anonymous true

# Listen on the default MQTT port on all interfaces
listener 1883

# Persist messages across broker restarts
persistence true
persistence_location /mosquitto/data/

# Log to file and stdout
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Log level: error | warning | notice | information | debug
log_type information

# Connection / keep-alive settings
# keepalive_interval 60   # seconds (default)
